---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: keycloakclients.platform.inari.io
spec:
  group: platform.inari.io
  names:
    kind: KeycloakClient
    listKind: KeycloakClientList
    plural: keycloakclients
    shortNames:
    - kcc
    singular: keycloakclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantID
      name: Tenant
      type: string
    - jsonPath: .status.clientID
      name: ClientID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KeycloakClient is a platform-scoped Catalog Item provisioning an OIDC
          client in a tenant Keycloak realm for workload federation (§5.4, §5.6).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KeycloakClientSpec defines a tenant OIDC client inside a tenant realm
              (§5.4). Confidential clients get their secret written into the tenant
              namespace.
            properties:
              clientID:
                description: ClientID is the OIDC client identifier. Defaults to the
                  CR name.
                type: string
              impersonateServiceAccount:
                description: |-
                  ImpersonateServiceAccount is the tenant-scoped ServiceAccount the
                  operator impersonates when writing tenant-visible child resources into
                  the tenant namespace (§5.6: access mediated by impersonation).
                type: string
              namespace:
                description: |-
                  Namespace is the tenant's namespace on the platform cluster. Tenant
                  access is namespace-isolated (§5.6); child resources the tenant may
                  observe are written here.
                minLength: 1
                type: string
              public:
                default: false
                description: Public marks the client as public (no secret). Default
                  is confidential.
                type: boolean
              realmRef:
                description: RealmRef references the KeycloakRealm this client belongs
                  to.
                type: string
              redirectURIs:
                description: RedirectURIs allowed for authorization code flows.
                items:
                  type: string
                type: array
              secretName:
                description: |-
                  SecretName is the name of the Secret written into the tenant namespace
                  holding the client credentials. Defaults to "<name>-keycloak-client".
                type: string
              serviceAccountsEnabled:
                default: true
                description: |-
                  ServiceAccountsEnabled enables the client credentials grant for
                  workload-to-workload federation.
                type: boolean
              tenantID:
                description: TenantID is the platform-wide tenant identifier this
                  resource belongs to.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
            required:
            - namespace
            - public
            - realmRef
            - serviceAccountsEnabled
            - tenantID
            type: object
          status:
            description: KeycloakClientStatus exposes observed state for the Resources
              Inventory.
            properties:
              clientID:
                description: ClientID is the effective client identifier.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              secretName:
                description: SecretName is the tenant-namespace Secret holding credentials.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
