# Minimal third-party CRDs for envtest only. The real CRDs are shipped by
# ExternalDNS, cert-manager and ArgoCD on the platform cluster; these copies
# preserve unknown fields so the controllers' rendered children validate.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsendpoints.externaldns.k8s.io
  annotations:
    api-approved.kubernetes.io: "https://github.com/kubernetes-sigs/external-dns"
spec:
  group: externaldns.k8s.io
  scope: Namespaced
  names:
    kind: DNSEndpoint
    listKind: DNSEndpointList
    singular: dnsendpoint
    plural: dnsendpoints
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterissuers.cert-manager.io
spec:
  group: cert-manager.io
  scope: Cluster
  names:
    kind: ClusterIssuer
    listKind: ClusterIssuerList
    singular: clusterissuer
    plural: clusterissuers
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appprojects.argoproj.io
spec:
  group: argoproj.io
  scope: Namespaced
  names:
    kind: AppProject
    listKind: AppProjectList
    singular: appproject
    plural: appprojects
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
