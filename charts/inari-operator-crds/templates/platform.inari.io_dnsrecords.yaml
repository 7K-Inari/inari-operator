---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: dnsrecords.platform.inari.io
spec:
  group: platform.inari.io
  names:
    kind: DNSRecord
    listKind: DNSRecordList
    plural: dnsrecords
    singular: dnsrecord
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantID
      name: Tenant
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DNSRecord is a platform-scoped Catalog Item rendering ExternalDNS
          DNSEndpoints for tenant records (§5.6).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DNSRecordSpec defines DNS records inside a tenant zone.
            properties:
              endpoints:
                description: Endpoints are the ExternalDNS-style endpoint entries.
                items:
                  description: DNSRecordEndpoint is a single DNS endpoint entry.
                  properties:
                    dnsName:
                      description: DNSName is the record name (e.g. "app.team-a.apps.example.com").
                      minLength: 1
                      type: string
                    recordType:
                      description: RecordType is the DNS record type (A, CNAME, TXT,
                        ...).
                      enum:
                      - A
                      - AAAA
                      - CNAME
                      - TXT
                      - MX
                      - NS
                      - SRV
                      type: string
                    targets:
                      description: Targets are the record values.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    ttl:
                      default: 300
                      description: TTL in seconds.
                      format: int64
                      type: integer
                  required:
                  - dnsName
                  - recordType
                  - targets
                  type: object
                minItems: 1
                type: array
              impersonateServiceAccount:
                description: |-
                  ImpersonateServiceAccount is the tenant-scoped ServiceAccount the
                  operator impersonates when writing tenant-visible child resources into
                  the tenant namespace (§5.6: access mediated by impersonation).
                type: string
              namespace:
                description: |-
                  Namespace is the tenant's namespace on the platform cluster. Tenant
                  access is namespace-isolated (§5.6); child resources the tenant may
                  observe are written here.
                minLength: 1
                type: string
              tenantID:
                description: TenantID is the platform-wide tenant identifier this
                  resource belongs to.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              zoneRef:
                description: ZoneRef references the DNSZone this record belongs to.
                type: string
            required:
            - endpoints
            - namespace
            - tenantID
            - zoneRef
            type: object
          status:
            description: DNSRecordStatus exposes observed state for the Resources
              Inventory.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
