# Default values for inari-operator.

# Production posture (99.9% availability): run replicaCount: 2 with leader
# election enabled (the default) for active-passive HA, plus
# podAntiAffinity.enabled and a zone topologySpreadConstraint below. The
# single-replica default keeps dev installs light and never blocks node drains.
replicaCount: 1

# PodDisruptionBudget for the operator manager. Rendered only when
# replicaCount >= 2 — a single-replica install must never block voluntary
# disruptions (node drains, cluster upgrades).
pdb:
  minAvailable: 1

# Opt-in preferred pod anti-affinity spreading replicas across nodes
# (kubernetes.io/hostname). Recommended when replicaCount >= 2. Use the
# affinity escape hatch below for required anti-affinity or node affinity.
podAntiAffinity:
  enabled: false

# Topology spread constraints, e.g. to spread replicas across zones.
# labelSelector.matchLabels default to the operator selector labels when
# omitted from an entry. Example:
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: topology.kubernetes.io/zone
#       whenUnsatisfiable: ScheduleAnyway
topologySpreadConstraints: []

# Escape hatch: raw affinity merged into the pod spec alongside the
# podAntiAffinity preset above.
affinity: {}

image:
  repository: ghcr.io/7k-inari/inari-operator
  # Defaults to the chart's appVersion when empty; release-please keeps
  # appVersion aligned with the released operator image.
  tag: ""
  pullPolicy: IfNotPresent

# Leader election for the controller manager (args: --leader-elect).
leaderElection:
  enabled: true

# Keycloak Admin credentials consumed by the operator. Mirrors
# config/manager/manager.yaml: both keys are optional — when the secret is
# absent the operator runs without Keycloak integration.
keycloak:
  url: ""
  # tokenRealm overrides KEYCLOAK_TOKEN_REALM (default "master" in the
  # binary); set when the admin client lives in a non-master realm.
  tokenRealm: ""
  # clientId sets KEYCLOAK_CLIENT_ID directly; empty reads it from the
  # secret's clientIdKey (optional, operator default applies when absent).
  clientId: ""
  secret:
    # Name of the secret holding Keycloak credentials. Empty disables the
    # env wiring entirely.
    name: inari-operator-keycloak
    urlKey: url
    clientIdKey: client-id
    clientSecretKey: client-secret

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  # Annotations to add to the operator service account.
  annotations: {}
