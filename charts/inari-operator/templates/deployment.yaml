apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inari-operator.fullname" . }}
  labels:
    {{- include "inari-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "inari-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inari-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inari-operator.serviceAccountName" . }}
      {{- include "inari-operator.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "inari-operator.image" (dict "root" . "image" .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.leaderElection.enabled }}
          args:
            - --leader-elect
          {{- end }}
          env:
            {{- if .Values.keycloak.url }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            {{- else if .Values.keycloak.secret.name }}
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secret.name }}
                  key: {{ .Values.keycloak.secret.urlKey }}
                  optional: true
            {{- end }}
            {{- if .Values.keycloak.secret.name }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secret.name }}
                  key: {{ .Values.keycloak.secret.clientSecretKey }}
                  optional: true
            {{- end }}
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
