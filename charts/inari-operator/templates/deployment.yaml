apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inari-operator.fullname" . }}
  labels:
    {{- include "inari-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "inari-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inari-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inari-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.podAntiAffinity.enabled .Values.affinity }}
      affinity:
        {{- if .Values.podAntiAffinity.enabled }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "inari-operator.selectorLabels" . | nindent 20 }}
        {{- end }}
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - labelSelector:
            {{- if .labelSelector }}
            {{- toYaml .labelSelector | nindent 12 }}
            {{- else }}
            matchLabels:
              {{- include "inari-operator.selectorLabels" $ | nindent 14 }}
            {{- end }}
          {{- toYaml (omit . "labelSelector") | nindent 10 }}
        {{- end }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.leaderElection.enabled }}
          args:
            - --leader-elect
          {{- end }}
          env:
            {{- if .Values.keycloak.url }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            {{- else if .Values.keycloak.secret.name }}
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secret.name }}
                  key: {{ .Values.keycloak.secret.urlKey }}
                  optional: true
            {{- end }}
            {{- if .Values.keycloak.tokenRealm }}
            - name: KEYCLOAK_TOKEN_REALM
              value: {{ .Values.keycloak.tokenRealm | quote }}
            {{- end }}
            {{- if .Values.keycloak.clientId }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            {{- else if .Values.keycloak.secret.name }}
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secret.name }}
                  key: {{ .Values.keycloak.secret.clientIdKey | default "client-id" }}
                  optional: true
            {{- end }}
            {{- if .Values.keycloak.secret.name }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secret.name }}
                  key: {{ .Values.keycloak.secret.clientSecretKey }}
                  optional: true
            {{- end }}
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
