# Rules ported from config/rbac/role.yaml (manager-role, generated by
# controller-gen from +kubebuilder:rbac markers). Keep in sync when markers
# change — `make manifests` is the source of truth.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "inari-operator.fullname" . }}-manager
  labels:
    {{- include "inari-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  - resourcequotas
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - impersonate
- apiGroups:
  - argoproj.io
  resources:
  - appprojects
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - clusterissuers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - externaldns.k8s.io
  resources:
  - dnsendpoints
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.inari.io
  resources:
  - argoprojects
  - certissuers
  - dnsrecords
  - dnszones
  - keycloakclients
  - keycloakrealms
  - tenantnamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.inari.io
  resources:
  - argoprojects/finalizers
  - certissuers/finalizers
  - dnsrecords/finalizers
  - dnszones/finalizers
  - keycloakclients/finalizers
  - keycloakrealms/finalizers
  - tenantnamespaces/finalizers
  verbs:
  - update
- apiGroups:
  - platform.inari.io
  resources:
  - argoprojects/status
  - certissuers/status
  - dnsrecords/status
  - dnszones/status
  - keycloakclients/status
  - keycloakrealms/status
  - tenantnamespaces/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "inari-operator.fullname" . }}-manager
  labels:
    {{- include "inari-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "inari-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "inari-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "inari-operator.fullname" . }}-leader-election
  labels:
    {{- include "inari-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "inari-operator.fullname" . }}-leader-election
  labels:
    {{- include "inari-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "inari-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "inari-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
