{{- if ge (int .Values.replicaCount) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inari-operator.fullname" . }}
  labels:
    {{- include "inari-operator.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "inari-operator.selectorLabels" . | nindent 6 }}
{{- end }}
