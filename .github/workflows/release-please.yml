name: release-please

# PR-only mode: maintains the Release PR (version bump + CHANGELOG).
# Tag/GitHub Release/publish happen in release.yml after the Release PR is merged.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
