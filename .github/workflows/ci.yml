name: ci

on:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Setup envtest
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.20 use -p path 1.32.0)" >> "$GITHUB_ENV"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -coverprofile=cover.out
      - name: go build
        run: go build ./...

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push edge image
        # Per-commit edge images on main merges; signed/SBOM release images are
        # handled exclusively by release.yml.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/7k-inari/inari-operator:edge-${{ github.sha }}

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0
        with:
          version: v3.12.0
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.2
      - name: CRD drift check
        # config/crd/bases is generated; charts/inari-operator-crds must be a
        # verbatim sync. Fails if api/ markers changed without a chart sync.
        run: make chart-crds-check
      - name: helm lint
        run: |
          helm lint charts/inari-operator-crds
          helm lint charts/inari-operator
      - name: ct lint
        run: ct lint --config ct.yaml --validate-maintainers=false
      - name: helm unittest
        run: |
          helm unittest charts/inari-operator-crds
          helm unittest charts/inari-operator
      - name: Global image values render check
        # Fails if any rendered image ignores global.imageRegistry or any
        # workload pod spec ignores global.imagePullSecrets (plan §4.2).
        run: scripts/check-global-image-values.sh charts/inari-operator
